[workspace]
members = [
    "programs/*"
]
exclude = [
    "services",
    "services/core-api",
    "services/ws-mesh",
    "services/keeper-bots",
    "tests/onchain"
]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
