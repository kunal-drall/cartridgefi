[package]
name = "cartridgefi-onchain-tests"
version = "0.1.0"
description = "CartridgeFi On-Chain Security, MagicSVM PER/ER/VRF/Crank Lifecycle & 100k Solvency Fuzz Suite"
edition = "2021"
publish = false

[dependencies]
borsh = { version = "1.6.1", features = ["derive"] }
magicsvm = "0.3.0"
solana-account = "4.3.1"
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-rent = "~4.3.0"
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = "3.1.0"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = { version = "4.1.5", features = ["verify"] }

[dev-dependencies]
proptest = "1.6"
solana-transaction-error = "~3.3.1"
