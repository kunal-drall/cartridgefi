[package]
name = "cartridge-passport"
version = "0.1.0"
description = "CartridgeFi Cross-Game Market ELO & Earned Stock Vault Passport"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cartridge_passport"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
