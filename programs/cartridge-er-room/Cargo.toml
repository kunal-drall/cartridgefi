[package]
name = "cartridge-er-room"
version = "0.1.0"
description = "CartridgeFi MagicBlock Private ER TEE Multiplayer Room & VRF Settlement Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cartridge_er_room"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control", "vrf", "crank"] }

[target.'cfg(not(target_os = "solana"))'.dependencies]
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control", "vrf", "crank", "spl"] }
